<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Triwize Image Upload</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(
          180deg,
          #87ceeb 0%,
          #e0f6ff 50%,
          #ff9054 100%
        );
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }

      /* Sky gradient with clouds */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60%;
        background: linear-gradient(
          to bottom,
          #87ceeb 0%,
          #b0e0e6 30%,
          #e0f6ff 60%,
          transparent 100%
        );
        z-index: 1;
        pointer-events: none;
      }

      /* Sun glow */
      body::after {
        content: "";
        position: fixed;
        bottom: 15%;
        right: 10%;
        width: 300px;
        height: 300px;
        background: radial-gradient(
          circle,
          rgba(255, 144, 84, 0.3) 0%,
          transparent 70%
        );
        border-radius: 50%;
        z-index: 1;
        pointer-events: none;
        filter: blur(40px);
      }

      /* Animated clouds */
      .cloud {
        position: fixed;
        font-size: 80px;
        opacity: 0.6;
        z-index: 2;
        pointer-events: none;
        animation: drift linear infinite;
      }

      .cloud:nth-child(1) {
        top: 10%;
        left: -100px;
        animation-duration: 25s;
        animation-delay: 0s;
      }

      .cloud:nth-child(2) {
        top: 25%;
        left: -80px;
        animation-duration: 30s;
        animation-delay: 5s;
        font-size: 70px;
        opacity: 0.5;
      }

      .cloud:nth-child(3) {
        top: 40%;
        left: -120px;
        animation-duration: 35s;
        animation-delay: 10s;
        font-size: 90px;
        opacity: 0.4;
      }

      @keyframes drift {
        0% {
          transform: translateX(-100px);
        }
        100% {
          transform: translateX(100vw);
        }
      }

      /* Flying airplanes */
      .airplane {
        position: fixed;
        font-size: 40px;
        z-index: 3;
        pointer-events: none;
        animation: fly linear infinite;
      }

      .airplane:nth-child(4) {
        top: 15%;
        right: -50px;
        animation-duration: 20s;
        animation-delay: 0s;
      }

      .airplane:nth-child(5) {
        top: 50%;
        right: -50px;
        animation-duration: 25s;
        animation-delay: 5s;
        font-size: 35px;
      }

      .airplane:nth-child(6) {
        top: 70%;
        right: -50px;
        animation-duration: 30s;
        animation-delay: 10s;
        font-size: 45px;
        opacity: 0.8;
      }

      @keyframes fly {
        0% {
          transform: translateX(0) translateY(0);
        }
        50% {
          transform: translateX(-30px) translateY(-10px);
        }
        100% {
          transform: translateX(-100vw) translateY(0);
        }
      }

      /* Airplane trail effect */
      .airplane::before {
        content: "✈ ✈ ✈";
        position: absolute;
        right: 50px;
        font-size: 20px;
        opacity: 0.1;
      }

      .container {
        background: white;
        border-radius: 28px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
        max-width: 700px;
        width: 100%;
        overflow: hidden;
        position: relative;
        z-index: 10;
      }

      .header {
        background: linear-gradient(135deg, #ff9054 0%, #ff6b35 100%);
        color: white;
        padding: 3rem 2rem;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .header-decoration {
        position: absolute;
        top: -20px;
        right: -30px;
        font-size: 120px;
        opacity: 0.1;
        animation: float 6s ease-in-out infinite;
      }

      .header-decoration2 {
        position: absolute;
        bottom: -30px;
        left: -20px;
        font-size: 100px;
        opacity: 0.12;
        animation: float 7s ease-in-out infinite;
        animation-delay: 1s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-20px) rotate(10deg);
        }
      }

      .logo-section {
        margin-bottom: 20px;
        position: relative;
        z-index: 2;
        animation: slideDown 0.6s ease-out;
      }

      @keyframes slideDown {
        from {
          transform: translateY(-20px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .logo {
        width: 70px;
        height: 70px;
        background: white;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        font-size: 32px;
        font-weight: 800;
        background: linear-gradient(135deg, #ff9054 0%, #ff6b35 100%);
        color: white;
        border: 3px solid white;
        animation: rotate 4s ease-in-out infinite;
      }

      @keyframes rotate {
        0%,
        100% {
          transform: rotate(0deg) scale(1);
        }
        50% {
          transform: rotate(5deg) scale(1.05);
        }
      }

      .header h1 {
        font-size: 32px;
        margin-bottom: 8px;
        font-weight: 800;
        letter-spacing: -1px;
        position: relative;
        z-index: 2;
      }

      .header p {
        font-size: 15px;
        opacity: 0.95;
        margin: 0;
        position: relative;
        z-index: 2;
      }

      .brand-name {
        font-size: 12px;
        opacity: 0.9;
        margin-top: 12px;
        font-weight: 600;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        position: relative;
        z-index: 2;
      }

      .content {
        padding: 3rem 2.5rem;
      }

      .upload-area {
        border: 2.5px dashed #ff9054;
        border-radius: 18px;
        padding: 3rem 2rem;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        background: linear-gradient(
          135deg,
          rgba(255, 144, 84, 0.08) 0%,
          rgba(255, 107, 53, 0.08) 100%
        );
        position: relative;
        overflow: hidden;
      }

      .upload-area::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="sky-pattern" patternUnits="userSpaceOnUse" width="30" height="30"><circle cx="15" cy="15" r="1" fill="rgba(255,144,84,0.05)"/><path d="M5 15 Q15 10 25 15" stroke="rgba(255,144,84,0.05)" stroke-width="0.5" fill="none"/></pattern></defs><rect width="100" height="100" fill="url(%23sky-pattern)"/></svg>');
        pointer-events: none;
        border-radius: 18px;
      }

      .upload-area:hover {
        border-color: #ff6b35;
        background: linear-gradient(
          135deg,
          rgba(255, 144, 84, 0.15) 0%,
          rgba(255, 107, 53, 0.15) 100%
        );
        transform: translateY(-5px);
        box-shadow: 0 12px 35px rgba(255, 107, 53, 0.25);
      }

      .upload-area.drag-over {
        border-color: #ff5722;
        background: linear-gradient(
          135deg,
          rgba(255, 144, 84, 0.2) 0%,
          rgba(255, 107, 53, 0.2) 100%
        );
        transform: scale(1.03);
        box-shadow: 0 15px 40px rgba(255, 107, 53, 0.3);
      }

      .upload-content {
        position: relative;
        z-index: 1;
      }

      .upload-icon-wrapper {
        position: relative;
        margin-bottom: 16px;
        display: inline-block;
      }

      .upload-icon {
        font-size: 56px;
        background: linear-gradient(135deg, #ff9054 0%, #ff6b35 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        display: block;
        animation: floatAnimation 3s ease-in-out infinite;
      }

      .upload-icon::before {
        content: "";
        position: absolute;
        width: 80px;
        height: 80px;
        border: 2px solid rgba(255, 144, 84, 0.1);
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes floatAnimation {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-16px);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.3);
          opacity: 0;
        }
      }

      .upload-text h3 {
        font-size: 18px;
        color: #202124;
        margin-bottom: 6px;
        font-weight: 700;
      }

      .upload-text p {
        font-size: 14px;
        color: #5f6368;
        margin: 0;
      }

      input[type="file"] {
        display: none;
      }

      .preview-container {
        display: none;
        margin-top: 1.5rem;
        animation: fadeIn 0.4s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .preview-image {
        width: 100%;
        max-height: 300px;
        object-fit: cover;
        border-radius: 14px;
        margin-bottom: 1.5rem;
        border: 2px solid #ff9054;
        box-shadow: 0 8px 25px rgba(255, 107, 53, 0.2);
      }

      .file-name {
        font-size: 14px;
        color: #5f6368;
        margin-bottom: 1.5rem;
        text-align: center;
        word-break: break-all;
        font-weight: 600;
      }

      .button-group {
        display: flex;
        gap: 12px;
        margin-top: 1.5rem;
      }

      .btn {
        flex: 1;
        padding: 14px 18px;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .btn-primary {
        background: linear-gradient(135deg, #ff9054 0%, #ff6b35 100%);
        color: white;
        box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
      }

      .btn-primary:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 30px rgba(255, 107, 53, 0.5);
      }

      .btn-primary:active {
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: #f0f0f0;
        color: #202124;
        border: 1.5px solid #e8eaed;
      }

      .btn-secondary:hover {
        background: #e8e8e8;
        border-color: #ff9054;
      }

      .loading-container {
        display: none;
        text-align: center;
        padding: 3rem 0;
      }

      .spinner {
        width: 56px;
        height: 56px;
        border: 4px solid #f0f0f0;
        border-top-color: #ff9054;
        border-right-color: #ff6b35;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1.5rem;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        color: #5f6368;
        font-size: 15px;
        font-weight: 600;
      }

      .success-container {
        display: none;
        animation: slideUp 0.5s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .alert {
        padding: 1.5rem;
        border-radius: 14px;
        margin-bottom: 1.5rem;
        display: flex;
        gap: 12px;
      }

      .alert-success {
        background: linear-gradient(
          135deg,
          rgba(52, 168, 83, 0.12) 0%,
          rgba(30, 132, 73, 0.12) 100%
        );
        border: 1.5px solid rgba(52, 168, 83, 0.3);
        color: #137333;
      }

      .alert-error {
        background: linear-gradient(
          135deg,
          rgba(217, 48, 37, 0.12) 0%,
          rgba(179, 33, 30, 0.12) 100%
        );
        border: 1.5px solid rgba(217, 48, 37, 0.3);
        color: #d93025;
      }

      .alert-icon {
        font-size: 22px;
        flex-shrink: 0;
        margin-top: 2px;
      }

      .alert-content h4 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 700;
      }

      .alert-content p {
        margin: 0;
        font-size: 13px;
        opacity: 0.9;
      }

      .error-container {
        display: none;
      }

      .url-box {
        background: linear-gradient(
          135deg,
          rgba(255, 144, 84, 0.08) 0%,
          rgba(255, 107, 53, 0.08) 100%
        );
        border: 1.5px solid rgba(255, 144, 84, 0.3);
        border-radius: 14px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }

      .url-label {
        font-size: 11px;
        color: #5f6368;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        margin-bottom: 10px;
        display: block;
        font-weight: 700;
      }

      .url-input-group {
        display: flex;
        gap: 10px;
      }

      .url-input {
        flex: 1;
        padding: 12px 14px;
        border: 1.5px solid #e8eaed;
        border-radius: 10px;
        font-family: "Monaco", "Courier New", monospace;
        font-size: 12px;
        color: #202124;
        background: white;
        font-weight: 500;
      }

      .url-input:focus {
        outline: none;
        border-color: #ff9054;
        box-shadow: 0 0 0 3px rgba(255, 144, 84, 0.15);
      }

      .copy-btn {
        padding: 12px 16px;
        background: white;
        border: 1.5px solid #e8eaed;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 15px;
        color: #5f6368;
        font-weight: 600;
      }

      .copy-btn:hover {
        background: linear-gradient(135deg, #ff9054 0%, #ff6b35 100%);
        color: white;
        border: none;
        transform: scale(1.05);
      }

      .copy-btn.copied {
        background: linear-gradient(135deg, #34a853 0%, #1e8449 100%);
        color: white;
        border: none;
      }

      .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 1.5rem;
      }

      .info-item {
        background: linear-gradient(
          135deg,
          rgba(255, 144, 84, 0.08) 0%,
          rgba(255, 107, 53, 0.08) 100%
        );
        padding: 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 144, 84, 0.15);
      }

      .info-label {
        font-size: 11px;
        color: #5f6368;
        text-transform: uppercase;
        margin-bottom: 6px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }

      .info-value {
        font-size: 14px;
        font-weight: 700;
        color: #ff6b35;
        word-break: break-all;
      }

      .btn-block {
        width: 100%;
        display: block;
      }

      @media (max-width: 600px) {
        .container {
          border-radius: 20px;
          margin: 0;
        }

        .header {
          padding: 2.5rem 1.5rem;
        }

        .header h1 {
          font-size: 26px;
        }

        .content {
          padding: 2rem 1.5rem;
        }

        .upload-area {
          padding: 2.5rem 1rem;
          border-radius: 14px;
        }

        .upload-icon {
          font-size: 48px;
        }

        .button-group {
          flex-direction: column;
        }

        .info-grid {
          grid-template-columns: 1fr;
        }

        .btn {
          padding: 12px 16px;
        }

        .cloud {
          font-size: 50px;
        }

        .airplane {
          font-size: 30px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Animated clouds -->
    <div class="cloud">☁️</div>
    <div class="cloud">☁️</div>
    <div class="cloud">☁️</div>

    <!-- Flying airplanes -->
    <div class="airplane">✈️</div>
    <div class="airplane">✈️</div>
    <div class="airplane">✈️</div>

    <div class="container">
      <!-- Header -->
      <div class="header">
        <div class="header-decoration">✈️</div>
        <div class="header-decoration2">☁️</div>

        <div class="logo-section">
          <div class="logo">T</div>
        </div>
        <h1>Upload Image</h1>
        <p>Jet-Set Your Files to S3</p>
        <div class="brand-name">Powered by Triwize</div>
      </div>

      <!-- Content -->
      <div class="content">
        <!-- Upload Area -->
        <div id="uploadArea" class="upload-area">
          <input type="file" id="fileInput" accept="image/*" />
          <div class="upload-content">
            <div class="upload-icon-wrapper">
              <i class="fas fa-cloud-upload-alt upload-icon"></i>
            </div>
            <div class="upload-text">
              <p>Drag your image to take flight, or click to upload</p>
            </div>
          </div>
        </div>

        <!-- Preview Container -->
        <div id="previewContainer" class="preview-container">
          <img id="previewImage" class="preview-image" alt="Preview" />
          <p id="fileName" class="file-name"></p>
          <div class="button-group">
            <button id="uploadBtn" class="btn btn-primary">
              <i class="fas fa-upload"></i> Launch to S3 🚀
            </button>
            <button id="cancelBtn" class="btn btn-secondary">Clear</button>
          </div>
        </div>

        <!-- Loading Container -->
        <div id="loadingContainer" class="loading-container">
          <div class="spinner"></div>
          <p class="loading-text">Taking off... Uploading your image ✈️</p>
        </div>

        <!-- Success Container -->
        <div id="successContainer" class="success-container">
          <div class="alert alert-success">
            <i class="fas fa-check-circle alert-icon"></i>
            <div class="alert-content">
              <h4>Landed Successfully! 🛬</h4>
              <p>Your image has arrived safely in the cloud</p>
            </div>
          </div>

          <div class="url-box">
            <label class="url-label">📋 Image URL (Your S3 Link)</label>
            <div class="url-input-group">
              <input type="text" id="urlInput" class="url-input" readonly />
              <button id="copyBtn" class="copy-btn">
                <i class="fas fa-copy"></i>
              </button>
            </div>
          </div>

          <div class="info-grid">
            <div class="info-item">
              <div class="info-label">📁 File Name</div>
              <div class="info-value" id="resultFileName"></div>
            </div>
            <div class="info-item">
              <div class="info-label">💾 File Size</div>
              <div class="info-value" id="resultFileSize"></div>
            </div>
          </div>

          <button id="resetBtn" class="btn btn-primary btn-block">
            <i class="fas fa-redo"></i> Upload Another ✈️
          </button>
        </div>

        <!-- Error Container -->
        <div id="errorContainer" class="error-container">
          <div class="alert alert-error">
            <i class="fas fa-exclamation-circle alert-icon"></i>
            <div class="alert-content">
              <h4>Flight Cancelled ✈️</h4>
              <p id="errorMessage"></p>
            </div>
          </div>
          <button id="tryAgainBtn" class="btn btn-primary btn-block">
            <i class="fas fa-redo"></i> Retry Flight
          </button>
        </div>
      </div>
    </div>

    <script>
      const API_URL =
        "https://page-api.triwize.com/api/v1/upload_image_to_get_url";

      const fileInput = document.getElementById("fileInput");
      const uploadArea = document.getElementById("uploadArea");
      const previewContainer = document.getElementById("previewContainer");
      const previewImage = document.getElementById("previewImage");
      const fileName = document.getElementById("fileName");
      const uploadBtn = document.getElementById("uploadBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const loadingContainer = document.getElementById("loadingContainer");
      const successContainer = document.getElementById("successContainer");
      const errorContainer = document.getElementById("errorContainer");
      const resetBtn = document.getElementById("resetBtn");
      const tryAgainBtn = document.getElementById("tryAgainBtn");
      const copyBtn = document.getElementById("copyBtn");

      let selectedFile = null;

      // Click to upload
      uploadArea.addEventListener("click", () => fileInput.click());

      // Drag and drop
      uploadArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadArea.classList.add("drag-over");
      });

      uploadArea.addEventListener("dragleave", () => {
        uploadArea.classList.remove("drag-over");
      });

      uploadArea.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadArea.classList.remove("drag-over");

        const files = e.dataTransfer.files;
        if (files.length > 0) {
          handleFileSelect(files[0]);
        }
      });

      // File input change
      fileInput.addEventListener("change", (e) => {
        if (e.target.files.length > 0) {
          handleFileSelect(e.target.files[0]);
        }
      });

      // Button events
      uploadBtn.addEventListener("click", uploadImage);
      cancelBtn.addEventListener("click", cancelUpload);
      resetBtn.addEventListener("click", resetForm);
      tryAgainBtn.addEventListener("click", resetForm);
      copyBtn.addEventListener("click", copyToClipboard);

      function handleFileSelect(file) {
        if (!file.type.startsWith("image/")) {
          showError("Please select a valid image file (PNG, JPG, GIF, etc.)");
          return;
        }

        if (file.size > 10 * 1024 * 1024) {
          showError("File size must be less than 10MB");
          return;
        }

        selectedFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
          previewImage.src = e.target.result;
          fileName.textContent = file.name;
          uploadArea.style.display = "none";
          previewContainer.style.display = "block";
          errorContainer.style.display = "none";
        };
        reader.readAsDataURL(file);
      }

      function cancelUpload() {
        selectedFile = null;
        fileInput.value = "";
        previewContainer.style.display = "none";
        uploadArea.style.display = "block";
      }

      function resetForm() {
        selectedFile = null;
        fileInput.value = "";
        previewContainer.style.display = "none";
        loadingContainer.style.display = "none";
        successContainer.style.display = "none";
        errorContainer.style.display = "none";
        uploadArea.style.display = "block";
      }

      function uploadImage() {
        if (!selectedFile) return;

        const formData = new FormData();
        formData.append("file", selectedFile);

        previewContainer.style.display = "none";
        loadingContainer.style.display = "block";
        errorContainer.style.display = "none";

        fetch(API_URL, {
          method: "POST",
          body: formData,
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.success) {
              showSuccess(data);
            } else {
              showError(data.message || "Upload failed");
            }
          })
          .catch((error) => {
            showError(
              "Network error. Make sure the API server is running and accessible at: " +
                API_URL,
            );
            console.error("Upload error:", error);
          });
      }

      function showSuccess(data) {
        loadingContainer.style.display = "none";
        successContainer.style.display = "block";
        previewContainer.style.display = "none";

        document.getElementById("urlInput").value = data.url;
        document.getElementById("resultFileName").textContent = data.filename;
        document.getElementById("resultFileSize").textContent =
          (data.file_size / 1024).toFixed(2) + " KB";
      }

      function showError(message) {
        loadingContainer.style.display = "none";
        errorContainer.style.display = "block";
        previewContainer.style.display = "none";
        uploadArea.style.display = "none";
        document.getElementById("errorMessage").textContent = message;
      }

      function copyToClipboard() {
        const urlInput = document.getElementById("urlInput");
        urlInput.select();
        document.execCommand("copy");

        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = '<i class="fas fa-check"></i>';
        copyBtn.classList.add("copied");

        setTimeout(() => {
          copyBtn.innerHTML = originalText;
          copyBtn.classList.remove("copied");
        }, 2000);
      }
    </script>
  </body>
</html>
