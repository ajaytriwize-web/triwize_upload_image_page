<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Triwize Image Upload - DEBUG</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(
          180deg,
          #87ceeb 0%,
          #e0f6ff 50%,
          #ff9054 100%
        );
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
        max-width: 800px;
        width: 100%;
        padding: 40px;
      }

      h1 {
        color: #ff6b35;
        margin-bottom: 10px;
      }

      .upload-area {
        border: 2px dashed #ff9054;
        border-radius: 12px;
        padding: 40px;
        text-align: center;
        cursor: pointer;
        margin: 20px 0;
      }

      .upload-area:hover {
        background: #fff5f0;
      }

      input[type="file"] {
        display: none;
      }

      .btn {
        background: linear-gradient(135deg, #ff9054 0%, #ff6b35 100%);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        margin: 10px 5px;
      }

      .btn:hover {
        transform: translateY(-2px);
      }

      .debug-box {
        background: #f5f5f5;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 15px;
        margin: 15px 0;
        font-size: 12px;
        font-family: monospace;
        max-height: 400px;
        overflow-y: auto;
      }

      .debug-box.error {
        background: #ffebee;
        border-color: #c62828;
        color: #c62828;
      }

      .debug-box.success {
        background: #e8f5e9;
        border-color: #2e7d32;
        color: #2e7d32;
      }

      .file-info {
        background: #e3f2fd;
        padding: 10px;
        border-radius: 8px;
        margin: 10px 0;
      }

      .loading {
        display: none;
        text-align: center;
      }

      .spinner {
        border: 4px solid #f0f0f0;
        border-top: 4px solid #ff9054;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔍 Image Upload - DEBUG VERSION</h1>
      <p>This version shows exactly what's happening</p>

      <div class="upload-area" id="uploadArea">
        <p>Click to upload or drag image here</p>
        <input type="file" id="fileInput" accept="image/*" />
      </div>

      <div class="file-info" id="fileInfo" style="display: none">
        <strong>📁 Selected File:</strong>
        <p>Name: <span id="fileName"></span></p>
        <p>Size: <span id="fileSize"></span> bytes</p>
        <p>Type: <span id="fileType"></span></p>
      </div>

      <button id="uploadBtn" class="btn" style="display: none">
        Upload File
      </button>

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Uploading...</p>
      </div>

      <div class="debug-box">
        <strong>📋 DEBUG LOG:</strong>
        <div id="debugLog"></div>
      </div>

      <div id="response"></div>
    </div>

    <script>
      const API_URL =
        "https://page-api.triwize.com/api/v1/upload_image_to_get_url";

      let selectedFile = null;
      const debugLog = document.getElementById("debugLog");
      const uploadArea = document.getElementById("uploadArea");
      const fileInput = document.getElementById("fileInput");
      const uploadBtn = document.getElementById("uploadBtn");
      const fileInfo = document.getElementById("fileInfo");

      // Helper to log debug messages
      function log(message, type = "info") {
        const timestamp = new Date().toLocaleTimeString();
        const logEntry = document.createElement("div");
        logEntry.style.marginBottom = "5px";

        if (type === "error") {
          logEntry.style.color = "#c62828";
          logEntry.innerHTML = `<strong>[${timestamp}] ❌</strong> ${message}`;
        } else if (type === "success") {
          logEntry.style.color = "#2e7d32";
          logEntry.innerHTML = `<strong>[${timestamp}] ✅</strong> ${message}`;
        } else {
          logEntry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
        }

        debugLog.appendChild(logEntry);
        debugLog.scrollTop = debugLog.scrollHeight;
        console.log(`[${timestamp}] ${message}`);
      }

      log("Page loaded", "success");
      log(`API URL: ${API_URL}`);

      uploadArea.addEventListener("click", () => {
        log("Upload area clicked");
        fileInput.click();
      });

      uploadArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        log("File dragged over upload area");
        uploadArea.style.background = "#fff5f0";
      });

      uploadArea.addEventListener("dragleave", () => {
        uploadArea.style.background = "";
      });

      uploadArea.addEventListener("drop", (e) => {
        e.preventDefault();
        log("File dropped on upload area");
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          handleFileSelect(files[0]);
        }
      });

      fileInput.addEventListener("change", (e) => {
        log("File input changed");
        if (e.target.files.length > 0) {
          handleFileSelect(e.target.files[0]);
        }
      });

      uploadBtn.addEventListener("click", uploadImage);

      function handleFileSelect(file) {
        log(`File selected: ${file.name}`, "info");
        log(`File size: ${file.size} bytes`);
        log(`File type: ${file.type}`);

        if (!file.type.startsWith("image/")) {
          log("Error: Not an image file!", "error");
          return;
        }

        selectedFile = file;

        document.getElementById("fileName").textContent = file.name;
        document.getElementById("fileSize").textContent = file.size;
        document.getElementById("fileType").textContent = file.type;

        fileInfo.style.display = "block";
        uploadBtn.style.display = "block";

        log(
          `✅ File ready for upload: ${file.name} (${file.size} bytes)`,
          "success",
        );
      }

      function uploadImage() {
        if (!selectedFile) {
          log("No file selected!", "error");
          return;
        }

        log("=== STARTING UPLOAD ===");
        log(`File: ${selectedFile.name}`);
        log(`Size: ${selectedFile.size} bytes`);

        const formData = new FormData();

        // Log what we're adding to FormData
        log(`Adding file to FormData...`);
        formData.append("file", selectedFile);

        // Log FormData contents
        log(`FormData entries:`);
        for (let pair of formData.entries()) {
          const key = pair[0];
          const value = pair[1];
          if (value instanceof File) {
            log(
              `  - ${key}: File(name="${value.name}", size=${value.size}, type="${value.type}")`,
            );
          } else {
            log(`  - ${key}: ${value}`);
          }
        }

        document.getElementById("loading").style.display = "block";

        log(`Sending POST request to: ${API_URL}`);

        fetch(API_URL, {
          method: "POST",
          body: formData,
          // Don't set Content-Type header - browser will set it with boundary
        })
          .then((response) => {
            log(`Response status: ${response.status}`);
            log(`Response headers:`);
            log(`  - Content-Type: ${response.headers.get("content-type")}`);
            log(
              `  - Access-Control-Allow-Origin: ${response.headers.get("access-control-allow-origin")}`,
            );

            if (!response.ok) {
              return response.text().then((text) => {
                log(`HTTP Error: ${response.status}`, "error");
                log(`Response body: ${text}`, "error");
                throw new Error(`HTTP ${response.status}`);
              });
            }

            return response.json();
          })
          .then((data) => {
            log("=== SUCCESS ===", "success");
            log(`Response JSON:`, "success");
            log(JSON.stringify(data, null, 2));

            document.getElementById("response").innerHTML = `
                        <div style="background: #e8f5e9; padding: 15px; border-radius: 8px; margin-top: 15px;">
                            <h3>✅ Upload Successful!</h3>
                            <p><strong>URL:</strong> <input type="text" value="${data.url || data.image_url || "NO URL"}" style="width: 100%; padding: 8px;" readonly></p>
                            <p><strong>Filename:</strong> ${data.filename || data.file_name || "unknown"}</p>
                            <p><strong>Size:</strong> ${data.file_size || "unknown"} bytes</p>
                        </div>
                    `;
          })
          .catch((error) => {
            log("=== UPLOAD FAILED ===", "error");
            log(`Error: ${error.message}`, "error");
            log(`Stack: ${error.stack}`, "error");

            document.getElementById("response").innerHTML = `
                        <div style="background: #ffebee; padding: 15px; border-radius: 8px; margin-top: 15px; color: #c62828;">
                            <h3>❌ Upload Failed</h3>
                            <p>${error.message}</p>
                            <p>Check browser console (F12) and the DEBUG LOG above for details</p>
                        </div>
                    `;
          })
          .finally(() => {
            document.getElementById("loading").style.display = "none";
          });
      }

      log("Event listeners attached", "success");
      log("Ready to upload files!", "success");
    </script>
  </body>
</html>
