<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Image - Simple</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        width: 100%;
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
        text-align: center;
      }
      .upload-box {
        border: 2px dashed #667eea;
        padding: 30px;
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
        margin: 20px 0;
      }
      .upload-box:hover {
        background: #f0f0f0;
        border-color: #764ba2;
      }
      .upload-box.drag-over {
        background: #e8e8ff;
        border-color: #764ba2;
      }
      input[type="file"] {
        display: none;
      }
      button {
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        margin: 10px 5px;
        transition: all 0.3s;
      }
      button:hover {
        background: #764ba2;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .info {
        background: #f5f5f5;
        padding: 15px;
        border-radius: 5px;
        margin: 15px 0;
        font-size: 14px;
        line-height: 1.6;
      }
      .success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .warning {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeeba;
      }
      .url-box {
        background: #e8f4f8;
        padding: 15px;
        border-radius: 5px;
        margin: 15px 0;
        word-break: break-all;
        font-family: monospace;
        font-size: 12px;
      }
      .copy-btn {
        background: #28a745;
        padding: 8px 15px;
        font-size: 14px;
      }
      .copy-btn:hover {
        background: #218838;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📤 Upload Image to S3</h1>

      <div class="upload-box" id="uploadBox">
        <p>Click to upload or drag file here</p>
        <input type="file" id="fileInput" accept="image/*" />
      </div>

      <div id="fileInfo" class="info" style="display: none">
        <strong>Selected File:</strong><br />
        Name: <span id="fileName"></span><br />
        Size: <span id="fileSize"></span> bytes
      </div>

      <button id="uploadBtn" disabled>Upload File</button>
      <button id="clearBtn">Clear</button>

      <div id="status" class="info" style="display: none"></div>

      <div id="urlBox" class="url-box" style="display: none">
        <strong>✅ Upload Successful!</strong><br />
        URL: <span id="urlText"></span><br />
        <button class="copy-btn" onclick="copyUrl()">Copy URL</button>
      </div>

      <div
        id="debugLog"
        class="info"
        style="background: #f0f0f0; max-height: 300px; overflow-y: auto"
      >
        <strong>📋 Debug Log:</strong><br />
        <div id="logContent"></div>
      </div>
    </div>

    <script>
      const API_URL =
        "https://page-api.triwize.com/api/v1/upload_image_to_get_url";
      let selectedFile = null;

      // Debug logging
      function log(message, type = "info") {
        const timestamp = new Date().toLocaleTimeString();
        const logContent = document.getElementById("logContent");
        const logEntry = document.createElement("div");
        let prefix = "ℹ️";
        if (type === "error") prefix = "❌";
        if (type === "success") prefix = "✅";
        if (type === "warning") prefix = "⚠️";

        logEntry.textContent = `[${timestamp}] ${prefix} ${message}`;
        logEntry.style.marginBottom = "5px";
        if (type === "error") logEntry.style.color = "red";
        if (type === "success") logEntry.style.color = "green";
        if (type === "warning") logEntry.style.color = "orange";

        logContent.appendChild(logEntry);
        logContent.parentElement.scrollTop =
          logContent.parentElement.scrollHeight;
        console.log(`[${type.toUpperCase()}]`, message);
      }

      log("Page loaded", "success");
      log(`API URL: ${API_URL}`, "info");

      const uploadBox = document.getElementById("uploadBox");
      const fileInput = document.getElementById("fileInput");
      const uploadBtn = document.getElementById("uploadBtn");
      const clearBtn = document.getElementById("clearBtn");

      // Upload box click
      uploadBox.addEventListener("click", () => {
        log("Upload box clicked");
        fileInput.click();
      });

      // Drag and drop
      uploadBox.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadBox.classList.add("drag-over");
        log("File dragged over");
      });

      uploadBox.addEventListener("dragleave", () => {
        uploadBox.classList.remove("drag-over");
      });

      uploadBox.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadBox.classList.remove("drag-over");
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          log("File dropped");
          handleFileSelect(files[0]);
        }
      });

      // File input change
      fileInput.addEventListener("change", (e) => {
        log("File input changed");
        if (e.target.files.length > 0) {
          handleFileSelect(e.target.files[0]);
        }
      });

      // Handle file selection
      function handleFileSelect(file) {
        log(`File selected: ${file.name}`, "info");
        log(`File size: ${file.size} bytes`, "info");
        log(`File type: ${file.type}`, "info");

        if (file.size === 0) {
          log("ERROR: File is empty!", "error");
          showStatus("File is empty!", "error");
          return;
        }

        if (!file.type.startsWith("image/")) {
          log("ERROR: Not an image file!", "error");
          showStatus("Please select an image file!", "error");
          return;
        }

        selectedFile = file;
        document.getElementById("fileName").textContent = file.name;
        document.getElementById("fileSize").textContent = file.size;
        document.getElementById("fileInfo").style.display = "block";
        uploadBtn.disabled = false;

        log("File ready for upload", "success");
      }

      // Upload function
      uploadBtn.addEventListener("click", async () => {
        if (!selectedFile) {
          log("No file selected!", "error");
          return;
        }

        log("=== STARTING UPLOAD ===", "info");
        log(`File: ${selectedFile.name}`, "info");
        log(`Size: ${selectedFile.size} bytes`, "info");

        // Create FormData
        const formData = new FormData();
        formData.append("file", selectedFile);

        log("FormData created", "success");
        log("Making fetch request...", "info");

        uploadBtn.disabled = true;
        showStatus("Uploading...", "warning");

        try {
          log(`Fetching: ${API_URL}`, "info");

          const response = await fetch(API_URL, {
            method: "POST",
            body: formData,
          });

          log(`Response status: ${response.status}`, "info");
          log(`Response type: ${response.headers.get("content-type")}`, "info");

          if (!response.ok) {
            const text = await response.text();
            log(`Error response: ${text}`, "error");
            showStatus(`Error: HTTP ${response.status}`, "error");
            uploadBtn.disabled = false;
            return;
          }

          const data = await response.json();
          log("Response JSON received", "success");
          log(`Response: ${JSON.stringify(data)}`, "success");

          if (data.success && data.url) {
            log(`Upload successful! URL: ${data.url}`, "success");
            showUrl(data.url);
            showStatus("Upload successful! ✅", "success");
          } else if (data.url) {
            log(`Upload successful! URL: ${data.url}`, "success");
            showUrl(data.url);
            showStatus("Upload successful! ✅", "success");
          } else {
            log(`No URL in response: ${JSON.stringify(data)}`, "error");
            showStatus("Upload failed: No URL returned", "error");
            uploadBtn.disabled = false;
          }
        } catch (error) {
          log(`Fetch error: ${error.message}`, "error");
          log(`Stack: ${error.stack}`, "error");
          showStatus(`Error: ${error.message}`, "error");
          uploadBtn.disabled = false;
        }
      });

      // Clear button
      clearBtn.addEventListener("click", () => {
        selectedFile = null;
        fileInput.value = "";
        document.getElementById("fileInfo").style.display = "none";
        document.getElementById("status").style.display = "none";
        document.getElementById("urlBox").style.display = "none";
        uploadBtn.disabled = true;
        log("Form cleared", "info");
      });

      // Show status message
      function showStatus(message, type = "info") {
        const statusDiv = document.getElementById("status");
        statusDiv.textContent = message;
        statusDiv.className = `info ${type}`;
        statusDiv.style.display = "block";
      }

      // Show URL result
      function showUrl(url) {
        document.getElementById("urlText").textContent = url;
        document.getElementById("urlBox").style.display = "block";
      }

      // Copy URL to clipboard
      function copyUrl() {
        const url = document.getElementById("urlText").textContent;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(() => {
            log("URL copied to clipboard", "success");
            alert("URL copied!");
          });
        } else {
          // Fallback
          const textarea = document.createElement("textarea");
          textarea.value = url;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          document.body.removeChild(textarea);
          log("URL copied to clipboard (fallback)", "success");
          alert("URL copied!");
        }
      }

      log("Ready to upload", "success");
    </script>
  </body>
</html>
